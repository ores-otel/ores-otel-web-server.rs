name: runtime-config-conformance

on:
  pull_request:
    paths:
      - '.ores-mw.toml'
      - '.ores-otel.toml'
      - '.ores-rl.toml'
      - '.ores-lru.toml'
      - '.shared-auth.toml'
      - 'config/ores-middleware-stack.json'
      - 'conformance/**'
      - '.zpkg.toml'
      - '.zpkg/hooks/**'
      - '.githooks/pre-push'
      - '.github/workflows/runtime-config-conformance.yml'
  push:
    branches: [main]
    paths:
      - '.ores-mw.toml'
      - '.ores-otel.toml'
      - '.ores-rl.toml'
      - '.ores-lru.toml'
      - '.shared-auth.toml'
      - 'config/ores-middleware-stack.json'
      - 'conformance/**'
      - '.zpkg.toml'
      - '.zpkg/hooks/**'
      - '.githooks/pre-push'
      - '.github/workflows/runtime-config-conformance.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - name: Check runtime configuration contracts
        run: sh conformance/check.sh --full
      - name: Verify authored inputs stayed immutable
        run: git diff --exit-code -- .ores-mw.toml .ores-otel.toml .ores-rl.toml .ores-lru.toml .shared-auth.toml config/ conformance/ .zpkg.toml .zpkg/hooks/ .githooks/pre-push
